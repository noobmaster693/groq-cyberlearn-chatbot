<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Assistant IA du cours</title>
  <link rel="stylesheet" href="/legacy.css?v=10">

</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="brand" id="brand"></div>
      <div class="tabs">
        <button class="tab" id="chatTab">Chat</button>
        <button class="tab" id="pythonTab">Python</button>
        <button class="tab" id="optionsTab">Options ▾</button>
      </div>
    </div>

    <section class="main">
      <aside class="drawer hidden" id="drawer">
        <div class="drawer-title"><span>Options</span><button id="closeDrawer">×</button></div>
        <div class="drawer-grid">
          <select id="chatSelect"></select>
          <button id="newChat">＋ Nouveau chat</button>
          <button id="renameChat">✎ Renommer</button>
          <button id="deleteChat">× Supprimer</button>
          <button id="theme">◐ Thème</button>
          <button class="wide" id="textSettings">Textes visibles…</button>
        </div>
      </aside>

      <section class="view" id="chatView">
        <div class="chat-log" id="chatLog"></div>
      </section>

      <section class="view legacy-workspace hidden" id="pythonView">
        <div class="legacy-form">
          <input class="legacy-input span2" id="pyQuestion" placeholder="text box">
          <input class="legacy-input span2" id="pyContext" placeholder="text box">
          <input class="legacy-input left" data-manual="0" placeholder="text box">
          <input class="legacy-input right" data-manual="1" placeholder="text box">
          <input class="legacy-input left small" data-manual="2" placeholder="text box">
          <div></div>
          <input class="legacy-input left" data-manual="3" placeholder="text box">
          <input class="legacy-input right" data-manual="4" placeholder="text box">
          <input class="legacy-input left" data-manual="5" placeholder="text box">
          <input class="legacy-input right" data-manual="6" placeholder="text box">
          <input class="legacy-input left" data-manual="7" placeholder="text box">
          <input class="legacy-input right" data-manual="8" placeholder="text box">
          <input class="legacy-input left" data-manual="9" placeholder="text box">
          <input class="legacy-input right" data-manual="10" placeholder="text box">
          <input class="legacy-input left" data-manual="11" placeholder="text box">
          <input class="legacy-input right" data-manual="12" placeholder="text box">
          <input class="legacy-input left small" data-manual="13" placeholder="text box">
          <div></div>
          <input class="legacy-input left medium" data-manual="14" placeholder="text box">
        </div>

        <div class="editor">
          <div class="gutter">1
2
3
4</div>
          <textarea id="pyEditor" spellcheck="false">question = ""
context = ""
answer = ask_course_assistant(question, context)
print(answer)</textarea>
        </div>
        <div class="runrow">
          <button class="legacy-btn" id="clearPython">Clear</button>
          <button class="legacy-btn" id="runPython">Run</button>
        </div>
        <div class="py-history" id="pyHistory"></div>
      </section>
    </section>

    <form id="chatForm" class="composer">
      <textarea id="question" placeholder="Écris ta question ici..."></textarea>
      <button class="legacy-btn" id="send" type="submit">Envoyer</button>
    </form>

    <section class="upload">
      <div class="upload-title"><button type="button" class="legacy-btn" id="browse">＋</button><span id="fileTitle">Fichiers</span></div>
      <div class="drop" id="drop" tabindex="0"><div><div class="drop-arrow">⬇</div><span id="dropText">Tu peux glisser des fichiers ici pour les ajouter.</span></div></div>
      <div class="chips" id="chips"></div><div class="status" id="status"></div>
      <input id="fileInput" hidden multiple type="file" accept="image/*,application/pdf,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.xml,.ino,.c,.cpp,.h,.java">
    </section>
  </main>

  <div class="modal" id="settingsModal">
    <div class="modal-box">
      <h2>Textes visibles</h2>
      <div class="settings-grid" id="settingsGrid"></div>
      <div class="modal-actions">
        <button class="legacy-btn" id="resetLabels" type="button">Reset</button>
        <button class="legacy-btn" id="closeSettings" type="button">Close</button>
        <button class="legacy-btn" id="saveLabels" type="button">Save</button>
      </div>
    </div>
  </div>

  <script src="/legacy.js?v=10"></script>

</body>
</html>
