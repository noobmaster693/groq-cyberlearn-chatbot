<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assistant IA du cours</title><style>
:root{--bg:#05070b;--p:#0d1117;--p2:#151b23;--p3:#1c2430;--b:#2b3544;--t:#f7fafc;--m:#a9b5c6;--a:#3578e5;--a2:#245bb9;--d:#e55353;--s:#28a269;--py:#081018;--py2:#0d1722;--pyb:#26384b;--pyt:#d6e6f5;--pym:#7f96aa;--str:#c6e88d;--fn:#82aaff}body.light{--bg:#f3f6fb;--p:#fff;--p2:#eef3fb;--p3:#e4ebf5;--b:#cdd7e5;--t:#182536;--m:#66758a;--a:#2563d8;--a2:#184caa}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:var(--bg);color:var(--t);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{height:100dvh;padding:10px;background:var(--bg)}.app{height:100%;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--b);border-radius:14px;background:var(--p)}header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--b)}h1{font-size:19px;margin:0 0 3px}header p{margin:0;color:var(--m);font-size:12px}.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.btn,select{min-height:34px;border:1px solid var(--b);border-radius:8px;background:var(--p2);color:var(--t);padding:6px 9px;font-size:12px;font-weight:700}.btn:hover,select:hover{border-color:var(--a)}select{max-width:220px}.seg{display:flex;gap:3px;padding:3px;border:1px solid var(--b);border-radius:9px;background:var(--p2)}.seg .btn{min-height:26px;border:0;background:transparent}.seg .on{background:var(--a);color:white}.chat{min-height:0;flex:1;overflow:auto;padding:16px;background:var(--bg)}.welcome,.bubble{max-width:920px;padding:11px 13px;border:1px solid var(--b);border-radius:10px;background:var(--p2);font-size:14px;line-height:1.55}.welcome{margin-bottom:14px}.msg{display:flex;margin:0 0 12px}.msg.user{justify-content:flex-end}.msg.user .bubble{background:var(--a);color:white;border-color:transparent}.files{font-size:11px;opacity:.86;margin-top:6px}.md p{margin:0 0 8px}.md ul,.md ol{margin:5px 0 8px;padding-left:20px}.code{margin:8px 0;overflow:hidden;border:1px solid var(--pyb);border-radius:8px;background:var(--py)}.codehead{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid var(--pyb);background:var(--py2);color:var(--pym);font-size:11px}.copy{border:1px solid var(--pyb);border-radius:5px;background:#172331;color:white;font-size:11px}.code pre,.py pre{margin:0;padding:10px;color:var(--pyt);white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}.py{margin:0 0 12px;overflow:hidden;border:1px solid var(--pyb);border-radius:9px;background:var(--py)}.pytitle{padding:6px 9px;border-bottom:1px solid var(--pyb);background:var(--py2);color:var(--pym);font:11px ui-monospace,monospace}.out{border-top:1px solid var(--pyb);background:#07101a}.fn{color:var(--fn)}.str{color:var(--str)}footer{padding:11px 13px;border-top:1px solid var(--b);background:var(--p)}.compose{display:flex;gap:7px}.compose textarea{flex:1;min-height:42px;max-height:120px;resize:vertical;border:1px solid var(--b);border-radius:8px;background:var(--p2);color:var(--t);padding:9px;outline:none}.compose textarea:focus{border-color:var(--a)}.send{border:0;border-radius:8px;background:var(--a);color:white;padding:0 17px;font-weight:800}.send:hover{background:var(--a2)}.upload{margin-top:9px;padding:7px;border:1px solid var(--b);border-radius:8px;background:var(--p2)}.uphead{display:flex;gap:7px;align-items:center;font-size:12px;font-weight:800}.drop{margin-top:6px;min-height:58px;display:grid;place-items:center;border:1px dashed var(--b);border-radius:7px;color:var(--m);text-align:center;font-size:12px;padding:7px}.drop.drag{border-color:var(--a)}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{display:flex;gap:5px;align-items:center;padding:4px 6px;border:1px solid var(--b);border-radius:6px;background:var(--p);font-size:11px}.chip img{width:24px;height:24px;object-fit:cover;border-radius:4px}.x{border:0;background:transparent;color:var(--m)}.status{min-height:15px;margin-top:5px;color:var(--m);font-size:11px}.err{color:var(--d)}.ok{color:var(--s)}.modal{position:fixed;inset:0;display:none;place-items:center;padding:16px;background:#0008}.modal.open{display:grid}.box{width:min(820px,100%);max-height:88vh;overflow:auto;border:1px solid var(--b);border-radius:11px;background:var(--p);padding:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field{display:grid;gap:4px}.field label{font-size:12px;color:var(--m)}.field input,.field textarea{border:1px solid var(--b);border-radius:7px;background:var(--p2);color:var(--t);padding:8px}.wide{grid-column:1/-1}@media(max-width:760px){.shell{padding:0}.app{border-radius:0}.grid{grid-template-columns:1fr}.wide{grid-column:auto}header{padding:10px}.tools{width:100%}select{flex:1}.lbl{display:none}.chat{padding:12px}.bubble{max-width:94%}}
</style></head><body><main class="shell"><section class="app"><header><div><h1 id="title"></h1><p id="subtitle"></p></div><div class="tools"><select id="chatSel"></select><button class="btn" id="new">＋ <span class="lbl"></span></button><button class="btn" id="rename">✏️ <span class="lbl"></span></button><button class="btn" id="del">🗑️ <span class="lbl"></span></button><div class="seg"><button class="btn" id="chatMode">💬 Chat</button><button class="btn" id="pyMode">🐍 Python</button></div><button class="btn" id="edit">⚙️ <span class="lbl"></span></button><button class="btn" id="theme">🌙 <span id="themeTxt"></span></button></div></header><div class="chat" id="chat"></div><footer><form id="form"><div class="compose"><textarea id="q"></textarea><button class="send" id="send"></button></div><div class="upload"><div class="uphead"><button type="button" class="btn" id="browse">＋</button><span id="fileTitle"></span></div><div class="drop" id="drop" tabindex="0"><div><b>⬇️</b><br><span id="dropTxt"></span></div></div><div class="chips" id="chips"></div><div class="status" id="status"></div><input hidden multiple id="file" type="file" accept="image/*,application/pdf,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.xml,.ino,.c,.cpp,.h,.java"></div></form></footer></section></main><div class="modal" id="modal"><div class="box"><h2>Text boxes</h2><div class="grid" id="fields"></div><p><button class="btn" id="save">Save</button> <button class="btn" id="reset">Reset</button> <button class="btn" id="close">Close</button></p></div></div><script>
const $=id=>document.getElementById(id),K={ch:'cy-chats-v3',active:'cy-active-v3',labels:'cy-labels-v3',mode:'cy-mode-v3',theme:'cy-theme-v3'},D={title:'Assistant IA du cours',subtitle:"Pose une question, joins un fichier ou colle une capture d’écran.",welcome:"Bonjour, je suis l’assistant IA de ce cours. Pose une question ou ajoute un fichier.",placeholder:'Écris ta question ici...',send:'Envoyer',files:'Fichiers',drop:'Tu peux glisser des fichiers ici pour les ajouter.',new:'Nouveau chat',rename:'Renommer',del:'Supprimer',edit:'Textes',light:'Mode clair',dark:'Mode sombre',pythonFile:'assistant_course.py',pythonFunction:'ask_course_assistant'},F=[['title','Main title'],['subtitle','Subtitle'],['welcome','Welcome message'],['placeholder','Question placeholder'],['send','Send button'],['files','Files title'],['drop','Drop-zone text'],['new','New chat'],['rename','Rename'],['del','Delete'],['edit','Settings'],['pythonFile','Python filename'],['pythonFunction','Python function']];let labels={...D,...JSON.parse(localStorage.getItem(K.labels)||'{}')},chats=[],active='',mode=localStorage.getItem(K.mode)||'chat',attachments=[],history=[];const MAX=5,IMG=3,EXT=new Set('txt md csv json js ts py html css xml ino c cpp h java'.split(' '));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':'&quot;',"'":"&#39;"}[c]))}function setStatus(t='',c=''){ $('status').textContent=t;$('status').className='status '+c }function id(){return crypto.randomUUID()}function fresh(){return{id:id(),title:'Nouveau chat',messages:[],history:[],updatedAt:Date.now()}}function current(){return chats.find(c=>c.id===active)}function saveChats(){chats=chats.sort((a,b)=>b.updatedAt-a.updatedAt).slice(0,25);localStorage.setItem(K.ch,JSON.stringify(chats));localStorage.setItem(K.active,active);renderSel()}function load(){try{chats=JSON.parse(localStorage.getItem(K.ch)||'[]')}catch{chats=[]}if(!chats.length)chats=[fresh()];active=localStorage.getItem(K.active)||chats[0].id;if(!current())active=chats[0].id;history=current().history||[]}
function renderSel(){let s=$('chatSel');s.innerHTML='';for(const c of chats){let o=document.createElement('option');o.value=c.id;o.textContent=c.title;o.selected=c.id===active;s.appendChild(o)}}function titleFrom(t){t=t.replace(/\s+/g,' ').trim();return t.length>38?t.slice(0,38)+'…':t||'Nouveau chat'}function newChat(){let c=fresh();chats.unshift(c);active=c.id;history=[];attachments=[];renderFiles();saveChats();render()}function rename(){let c=current(),n=prompt('New chat name:',c.title);if(n&&n.trim()){c.title=n.trim().slice(0,48);c.updatedAt=Date.now();saveChats()}}function del(){let c=current();if(!confirm('Delete this chat?'))return;chats=chats.filter(x=>x.id!==c.id);if(!chats.length)chats=[fresh()];active=chats[0].id;history=current().history||[];saveChats();render()}
function inline(t){return esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}function codeBlock(lang,code){let d=document.createElement('div');d.className='code';d.innerHTML='<div class="codehead"><span>'+esc(lang||'code')+'</span><button type="button" class="copy">Copy</button></div><pre>'+esc(code)+'</pre>';d.querySelector('button').onclick=async()=>{await navigator.clipboard.writeText(code);d.querySelector('button').textContent='Copied';setTimeout(()=>d.querySelector('button').textContent='Copy',1200)};return d}function assistantContent(text){let d=document.createElement('div'),r=/```([^\n`]*)\n?([\s\S]*?)```/g,last=0,m;d.className='md';while((m=r.exec(text))){if(m.index>last){let p=document.createElement('p');p.innerHTML=inline(text.slice(last,m.index));d.appendChild(p)}d.appendChild(codeBlock(m[1],m[2].replace(/\n$/,'')));last=r.lastIndex}if(last<text.length){let p=document.createElement('p');p.innerHTML=inline(text.slice(last));d.appendChild(p)}return d}
function classicMsg(m){let row=document.createElement('div');row.className='msg '+m.role;let b=document.createElement('div');b.className='bubble';if(m.role==='assistant')b.appendChild(assistantContent(m.content));else{b.textContent=m.content;if(m.files?.length){let f=document.createElement('div');f.className='files';f.textContent='📎 '+m.files.join(', ');b.appendChild(f)}}row.appendChild(b);return row}function pyMsg(m){let d=document.createElement('div');d.className='py';if(m.role==='user')d.innerHTML='<div class="pytitle">'+esc(labels.pythonFile)+'</div><pre><span class="fn">question</span> = <span class="str">"""'+esc(m.content)+'"""</span>\n\nanswer = <span class="fn">'+esc(labels.pythonFunction)+'</span>(question)\nprint(answer)</pre>';else{d.innerHTML='<div class="pytitle">output</div><pre class="out">'+esc(m.content)+'</pre>'}return d}function render(){let c=$('chat');c.innerHTML='<div class="welcome">'+esc(labels.welcome)+'</div>';for(const m of current().messages)c.appendChild(mode==='python'?pyMsg(m):classicMsg(m));c.scrollTop=c.scrollHeight;renderSel()}
function applyLabels(){ $('title').textContent=labels.title;$('subtitle').textContent=labels.subtitle;$('q').placeholder=labels.placeholder;$('send').textContent=labels.send;$('fileTitle').textContent='📁 '+labels.files;$('dropTxt').textContent=labels.drop;let l=document.querySelectorAll('.lbl');l[0].textContent=labels.new;l[1].textContent=labels.rename;l[2].textContent=labels.del;l[3].textContent=labels.edit;$('themeTxt').textContent=document.body.classList.contains('light')?labels.dark:labels.light}function setMode(m){mode=m;localStorage.setItem(K.mode,m);$('chatMode').classList.toggle('on',m==='chat');$('pyMode').classList.toggle('on',m==='python');render()}function toggleTheme(){document.body.classList.toggle('light');localStorage.setItem(K.theme,document.body.classList.contains('light')?'light':'dark');$('theme').firstChild.textContent=document.body.classList.contains('light')?'☀️ ':'🌙 ';applyLabels()}
function ext(n){return n.split('.').pop().toLowerCase()}function readURL(f){return new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}function loadImg(f){return new Promise((ok,no)=>{let i=new Image,u=URL.createObjectURL(f);i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=no;i.src=u})}async function imgFile(f){let i=await loadImg(f),r=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(i.width*r));c.height=Math.max(1,Math.round(i.height*r));c.getContext('2d').drawImage(i,0,0,c.width,c.height);let q=.88,u=c.toDataURL('image/jpeg',q);while(u.length>1e6&&q>.45){q-=.1;u=c.toDataURL('image/jpeg',q)}return{id:id(),kind:'image',name:f.name,mimeType:'image/jpeg',dataUrl:u,previewUrl:u}}async function prep(f){let e=ext(f.name);if(f.type.startsWith('image/'))return imgFile(f);if(f.type==='application/pdf'||e==='pdf')return{id:id(),kind:'pdf',name:f.name,mimeType:'application/pdf',dataUrl:await readURL(f)};if(EXT.has(e)||f.type.startsWith('text/'))return{id:id(),kind:'text',name:f.name,mimeType:f.type||'text/plain',text:(await f.text()).slice(0,12000)};throw Error('Unsupported file: '+f.name)}async function addFiles(list){for(const f of [...list]){if(attachments.length>=MAX)return setStatus('Maximum '+MAX+' files.','err');if(f.type.startsWith('image/')&&attachments.filter(x=>x.kind==='image').length>=IMG)return setStatus('Maximum '+IMG+' images.','err');try{attachments.push(await prep(f));renderFiles();setStatus('File added.','ok')}catch(e){setStatus(e.message,'err')}}}function renderFiles(){let c=$('chips');c.innerHTML='';for(const a of attachments){let d=document.createElement('div');d.className='chip';if(a.previewUrl)d.innerHTML='<img src="'+a.previewUrl+'">';d.innerHTML+='<span>'+esc(a.name)+'</span><button type="button" class="x">×</button>';d.querySelector('button').onclick=()=>{attachments=attachments.filter(x=>x.id!==a.id);renderFiles()};c.appendChild(d)}}
async function submit(e){e.preventDefault();let q=$('q').value.trim();if(!q&&!attachments.length)return setStatus('Add a question or file.','err');let c=current(),vis=q||'Analyze the attached files.',files=attachments;attachments=[];renderFiles();if(!c.messages.some(m=>m.role==='user'))c.title=titleFrom(vis);c.messages.push({role:'user',content:vis,files:files.map(x=>x.name)});c.updatedAt=Date.now();saveChats();render();$('q').value='';$('send').disabled=true;try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,history,attachments:files.map(({id,previewUrl,...x})=>x)})}),d=await r.json();if(!r.ok)throw Error(d.error||'Unknown error');c.messages.push({role:'assistant',content:d.reply});history.push({role:'user',content:vis},{role:'assistant',content:d.reply});history=history.slice(-16);c.history=history;c.updatedAt=Date.now();saveChats();render()}catch(e){c.messages.push({role:'assistant',content:'Error: '+e.message});render()}finally{$('send').disabled=false}}
function openLabels(){let g=$('fields');g.innerHTML='';for(const [k,n] of F){let d=document.createElement('div');d.className='field'+(['subtitle','welcome','drop'].includes(k)?' wide':'');d.innerHTML='<label>'+esc(n)+'</label><input data-k="'+k+'">';d.querySelector('input').value=labels[k];g.appendChild(d)}$('modal').classList.add('open')}function saveLabels(){for(const i of document.querySelectorAll('[data-k]'))labels[i.dataset.k]=i.value.trim()||D[i.dataset.k];localStorage.setItem(K.labels,JSON.stringify(labels));$('modal').classList.remove('open');applyLabels();render()}
$('form').onsubmit=submit;$('new').onclick=newChat;$('rename').onclick=rename;$('del').onclick=del;$('chatSel').onchange=e=>{active=e.target.value;history=current().history||[];saveChats();render()};$('chatMode').onclick=()=>setMode('chat');$('pyMode').onclick=()=>setMode('python');$('theme').onclick=toggleTheme;$('edit').onclick=openLabels;$('browse').onclick=()=>$('file').click();$('file').onchange=e=>addFiles(e.target.files);$('drop').onclick=()=>$('file').click();$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('drag')};$('drop').ondragleave=()=> $('drop').classList.remove('drag');$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('drag');addFiles(e.dataTransfer.files)};window.onpaste=e=>{let f=[...(e.clipboardData?.files||[])].filter(x=>x.type.startsWith('image/'));if(f.length){e.preventDefault();addFiles(f)}};$('close').onclick=()=> $('modal').classList.remove('open');$('save').onclick=saveLabels;$('reset').onclick=()=>{labels={...D};saveLabels()};
load();if(localStorage.getItem(K.theme)==='light')document.body.classList.add('light');applyLabels();setMode(mode);renderFiles();
</script></body></html>
