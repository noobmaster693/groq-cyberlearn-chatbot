<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistant IA du cours</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --panel: #0d0d0f;
      --panel-2: #141416;
      --panel-3: #1b1b1f;
      --border: #2b2b31;
      --text: #ffffff;
      --muted: #b8b8c2;
      --accent: #3b82f6;
      --accent-dark: #2563eb;
      --code-bg: #000000;
      --code-header: #18181b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: dark;
    }

    .chat-wrapper {
      min-height: 100vh;
      padding: 24px 0;
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.18), transparent 32%),
        radial-gradient(circle at bottom right, rgba(20, 184, 166, 0.10), transparent 28%),
        var(--bg);
    }

    .chat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(135deg, #111827, #020617);
      color: var(--text);
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }

    .chat-header h1 {
      font-size: 22px;
      font-weight: 750;
      margin: 0 0 4px;
      letter-spacing: -0.02em;
    }

    .chat-header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .chat-body {
      height: 520px;
      overflow-y: auto;
      padding: 24px;
      background: var(--bg);
      scrollbar-color: #3f3f46 transparent;
    }

    .message {
      display: flex;
      margin-bottom: 16px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 86%;
      padding: 13px 15px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .message.user .bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .bubble {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .message-text {
      white-space: pre-wrap;
    }

    .message-text:not(:last-child) {
      margin-bottom: 12px;
    }

    .code-block {
      margin: 12px 0;
      border: 1px solid #33343b;
      border-radius: 10px;
      overflow: hidden;
      background: var(--code-bg);
    }

    .code-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 10px;
      background: var(--code-header);
      border-bottom: 1px solid #33343b;
    }

    .code-language {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .copy-code-btn {
      border: 1px solid #3f3f46;
      background: #27272a;
      color: #fff;
      border-radius: 7px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .copy-code-btn:hover,
    .copy-code-btn:focus {
      background: #3f3f46;
      border-color: #52525b;
    }

    .code-block pre {
      margin: 0;
      padding: 14px;
      overflow-x: auto;
      background: var(--code-bg);
      color: #f8fafc;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre;
    }

    .code-block code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    .chat-footer {
      padding: 18px;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }

    .form-control {
      background: var(--panel-3);
      color: var(--text);
      border-radius: 8px;
      border-color: var(--border);
      box-shadow: none;
    }

    .form-control::placeholder {
      color: #8b8b96;
    }

    .form-control:focus {
      background: var(--panel-3);
      color: var(--text);
      border-color: var(--accent);
      box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.18);
    }

    .btn-send {
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      padding-left: 22px;
      padding-right: 22px;
      font-weight: 700;
      border: 0;
    }

    .btn-send:hover,
    .btn-send:focus {
      background: var(--accent-dark);
      color: #fff;
    }

    .small-note {
      color: var(--muted);
      font-size: 13px;
      margin-top: 10px;
    }

    @media (max-width: 575.98px) {
      .chat-wrapper {
        padding: 0;
      }

      .container {
        padding: 0;
      }

      .chat-card {
        border-radius: 0;
        min-height: 100vh;
        border-left: 0;
        border-right: 0;
      }

      .chat-body {
        height: calc(100vh - 200px);
        padding: 18px;
      }

      .bubble {
        max-width: 94%;
      }
    }
  </style>
</head>
<body>
  <main class="chat-wrapper">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
          <section class="chat-card">
            <header class="chat-header">
              <h1>Assistant IA du cours</h1>
              <p>Pose une question sur le cours et reçois une explication claire.</p>
            </header>

            <div id="chatBody" class="chat-body">
              <div class="message assistant">
                <div class="bubble">
                  <div class="message-text">Bonjour, je suis l'assistant IA de ce cours. Pose-moi une question sur un concept, une activité ou une leçon.</div>
                </div>
              </div>
            </div>

            <footer class="chat-footer">
              <form id="chatForm">
                <div class="input-group">
                  <input
                    id="messageInput"
                    type="text"
                    class="form-control"
                    placeholder="Écris ta question ici..."
                    autocomplete="off"
                    required
                  >
                  <button id="sendBtn" class="btn btn-send" type="submit">
                    Envoyer
                  </button>
                </div>
                <div class="small-note">
                  L'assistant aide à comprendre le cours, mais ne remplace pas les consignes de l'enseignant.
                </div>
              </form>
            </footer>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script>
    const chatForm = document.getElementById("chatForm");
    const chatBody = document.getElementById("chatBody");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    let history = [];

    function createTextPart(text) {
      const textPart = document.createElement("div");
      textPart.className = "message-text";
      textPart.textContent = text;
      return textPart;
    }

    function createCodeBlock(language, code) {
      const wrapper = document.createElement("div");
      wrapper.className = "code-block";

      const toolbar = document.createElement("div");
      toolbar.className = "code-toolbar";

      const label = document.createElement("span");
      label.className = "code-language";
      label.textContent = language || "code";

      const copyButton = document.createElement("button");
      copyButton.className = "copy-code-btn";
      copyButton.type = "button";
      copyButton.textContent = "Copier";

      copyButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(code);
          copyButton.textContent = "Copié";
          setTimeout(() => {
            copyButton.textContent = "Copier";
          }, 1400);
        } catch (error) {
          copyButton.textContent = "Erreur";
          setTimeout(() => {
            copyButton.textContent = "Copier";
          }, 1400);
        }
      });

      toolbar.appendChild(label);
      toolbar.appendChild(copyButton);

      const pre = document.createElement("pre");
      const codeEl = document.createElement("code");
      codeEl.textContent = code;
      pre.appendChild(codeEl);

      wrapper.appendChild(toolbar);
      wrapper.appendChild(pre);
      return wrapper;
    }

    function renderMessageContent(bubble, content) {
      const regex = /```([^\n`]*)\n?([\s\S]*?)```/g;
      let lastIndex = 0;
      let match;
      let hasContent = false;

      while ((match = regex.exec(content)) !== null) {
        const textBefore = content.slice(lastIndex, match.index);

        if (textBefore.trim()) {
          bubble.appendChild(createTextPart(textBefore));
          hasContent = true;
        }

        const language = match[1].trim();
        const code = match[2].replace(/^\n/, "").replace(/\n$/, "");
        bubble.appendChild(createCodeBlock(language, code));
        hasContent = true;
        lastIndex = regex.lastIndex;
      }

      const remainingText = content.slice(lastIndex);
      if (remainingText.trim() || !hasContent) {
        bubble.appendChild(createTextPart(remainingText));
      }
    }

    function addMessage(role, content) {
      const message = document.createElement("div");
      message.className = `message ${role}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (role === "assistant") {
        renderMessageContent(bubble, content);
      } else {
        bubble.appendChild(createTextPart(content));
      }

      message.appendChild(bubble);
      chatBody.appendChild(message);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function setLoading(isLoading) {
      sendBtn.disabled = isLoading;
      messageInput.disabled = isLoading;
      sendBtn.textContent = isLoading ? "..." : "Envoyer";
    }

    chatForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const message = messageInput.value.trim();

      if (!message) {
        return;
      }

      addMessage("user", message);
      messageInput.value = "";
      setLoading(true);

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message,
            history
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Erreur inconnue.");
        }

        addMessage("assistant", data.reply);

        history.push({ role: "user", content: message });
        history.push({ role: "assistant", content: data.reply });
        history = history.slice(-8);
      } catch (error) {
        addMessage("assistant", "Erreur : " + error.message);
      } finally {
        setLoading(false);
        messageInput.focus();
      }
    });
  </script>
</body>
</html>
