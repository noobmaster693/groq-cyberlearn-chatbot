<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistant IA du cours</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --soft-bg: #f5f7f8;
      --border: #e5e7eb;
      --text: #1f2937;
      --muted: #6b7280;
    }

    body {
      background: var(--soft-bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .chat-wrapper {
      min-height: 100vh;
      padding: 24px 0;
    }

    .chat-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      padding: 20px 24px;
    }

    .chat-header h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 4px;
    }

    .chat-header p {
      margin: 0;
      opacity: 0.9;
      font-size: 14px;
    }

    .chat-body {
      height: 480px;
      overflow-y: auto;
      padding: 24px;
      background: #fafafa;
    }

    .message {
      display: flex;
      margin-bottom: 16px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 82%;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .message.user .bubble {
      background: var(--primary);
      color: #fff;
      border-bottom-right-radius: 3px;
    }

    .message.assistant .bubble {
      background: #fff;
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
    }

    .chat-footer {
      padding: 18px;
      border-top: 1px solid var(--border);
      background: #fff;
    }

    .form-control {
      border-radius: 6px;
      border-color: var(--border);
      box-shadow: none;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 0.2rem rgba(15, 118, 110, 0.12);
    }

    .btn-send {
      background: var(--primary);
      color: #fff;
      border-radius: 6px;
      padding-left: 22px;
      padding-right: 22px;
      font-weight: 600;
    }

    .btn-send:hover,
    .btn-send:focus {
      background: var(--primary-dark);
      color: #fff;
    }

    .small-note {
      color: var(--muted);
      font-size: 13px;
      margin-top: 10px;
    }

    @media (max-width: 575.98px) {
      .chat-wrapper {
        padding: 0;
      }

      .chat-card {
        border-radius: 0;
        min-height: 100vh;
      }

      .chat-body {
        height: calc(100vh - 190px);
        padding: 18px;
      }

      .bubble {
        max-width: 92%;
      }
    }
  </style>
</head>
<body>
  <main class="chat-wrapper">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
          <section class="chat-card">
            <header class="chat-header">
              <h1>Assistant IA du cours</h1>
              <p>Pose une question sur le cours et reçois une explication claire.</p>
            </header>

            <div id="chatBody" class="chat-body">
              <div class="message assistant">
                <div class="bubble">
Bonjour, je suis l'assistant IA de ce cours. Pose-moi une question sur un concept, une activité ou une leçon.
                </div>
              </div>
            </div>

            <footer class="chat-footer">
              <form id="chatForm">
                <div class="input-group">
                  <input
                    id="messageInput"
                    type="text"
                    class="form-control"
                    placeholder="Écris ta question ici..."
                    autocomplete="off"
                    required
                  >
                  <button id="sendBtn" class="btn btn-send" type="submit">
                    Envoyer
                  </button>
                </div>
                <div class="small-note">
                  L'assistant aide à comprendre le cours, mais ne remplace pas les consignes de l'enseignant.
                </div>
              </form>
            </footer>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script>
    const chatForm = document.getElementById("chatForm");
    const chatBody = document.getElementById("chatBody");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    let history = [];

    function addMessage(role, content) {
      const message = document.createElement("div");
      message.className = `message ${role}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = content;

      message.appendChild(bubble);
      chatBody.appendChild(message);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function setLoading(isLoading) {
      sendBtn.disabled = isLoading;
      messageInput.disabled = isLoading;
      sendBtn.textContent = isLoading ? "..." : "Envoyer";
    }

    chatForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const message = messageInput.value.trim();

      if (!message) {
        return;
      }

      addMessage("user", message);
      messageInput.value = "";
      setLoading(true);

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message,
            history
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Erreur inconnue.");
        }

        addMessage("assistant", data.reply);

        history.push({ role: "user", content: message });
        history.push({ role: "assistant", content: data.reply });
        history = history.slice(-8);
      } catch (error) {
        addMessage("assistant", "Erreur : " + error.message);
      } finally {
        setLoading(false);
        messageInput.focus();
      }
    });
  </script>
</body>
</html>
